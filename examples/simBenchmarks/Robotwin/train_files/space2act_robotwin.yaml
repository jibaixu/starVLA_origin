run_id: space2act_robotwin
run_root_dir: playground/Checkpoints
seed: 42
wandb_project: starVLA_RoboTwin
wandb_entity: your_wandb_entity
is_debug: false
version_id: "0.21"

framework:
  name: QwenSpace2ActGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2560
  action_model:
    action_dim: 14
    state_dim: 14
    action_horizon: 50
    repeated_diffusion_steps: 8
  latent_reasoning:
    stage: 3
    routing_mode: native_causal
    token_order: spatial_instruction_plan_future
    token_init_strategy: avg
    query_chunk_size: 128
    confidence_aware_alignment:
      enabled: true
      min_weight: 0.0
      require_cached_confidence: true
    dynamics_bottleneck:
      enabled: true
      mode: hybrid
      dim: 256
      forward_weight: 0.05
      inverse_weight: 0.03
      intervention_weight: 0.02
      variance_weight: 0.005
      warmup_steps: 5000
      ramp_steps: 35000
      margin: 0.1
      variance_floor: 0.05
    pcgrad:
      enabled: true
      trigger_cosine: -0.05
      warmup_steps: 5000
      epsilon: 1.0e-12
      project_router: false
    loss_schedule:
      mode: gradnorm
      enabled: true
      diagnostic_interval: 1000
      auxiliary_budget: 0.30
      warmup_steps: 5000
      gradient_probe_interval: 20
      gradient_update_interval: 200
      gradient_ema_decay: 0.9
      alpha: 0.0
      gradient_epsilon: 1.0e-8
      min_weight: 0.05
      max_weight: 0.20
      adaptive_weight_ramp_steps: 35000
      knots: []
    channels:
      spatial: {token_enabled: true, token_count: 32, alignment_enabled: true, target_tokens: 1521, target_dim: 1024, alignment_dim: 1024, num_heads: 8, loss_weight: 1.0, mse_weight: 0.1}
      future: {token_enabled: true, token_count: 32, alignment_enabled: true, target_tokens: 1125, target_dim: 1024, alignment_dim: 1024, num_heads: 8, loss_weight: 1.0, mse_weight: 0.1}
      plan: {token_enabled: true, token_count: 32, alignment_enabled: true, target_tokens: 48, target_dim: 32, alignment_dim: 1024, num_heads: 8, loss_weight: 1.0, mse_weight: 0.1}

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/RoboTwin
    data_mix: robotwin_all_50
    seed: 42
    include_state: true
    action_type: abs_qpos
    action_mode: abs
    sequential_step_sampling: false
    per_device_batch_size: 4
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    video_backend: pyav
    episode_indices: null
    teacher_latents:
      channels:
        spatial:
          enabled: ${framework.latent_reasoning.channels.spatial.alignment_enabled}
          relative_dir: lingbot_latent_robotwin_stride16_samples4_confv1_pca1024
          target_tokens: ${framework.latent_reasoning.channels.spatial.target_tokens}
          target_dim: ${framework.latent_reasoning.channels.spatial.target_dim}
          feature_dtype: bfloat16
          anchor_dtype: int64
          confidence_key: confidence
          confidence_dtype: float32
          require_confidence: true
          anchor_stride: 16
          validate_episode_length: true
          expected_metadata: {complete: "true", dataset_format: robotwin, fps: "15", share_stride: "16", layer: "24", spatial_tokens: "1521", feature_dim: "1024", source_feature_dim: "5120", feature_transform: "tokenwise_pca_v1", cdb_anchor_contract: "shared_future_start"}
        future:
          enabled: ${framework.latent_reasoning.channels.future.alignment_enabled}
          relative_dir: wan2_2_future_robotwin_stride16_tstride6_samples4_confv1_pca1024
          target_tokens: ${framework.latent_reasoning.channels.future.target_tokens}
          target_dim: ${framework.latent_reasoning.channels.future.target_dim}
          feature_dtype: bfloat16
          anchor_dtype: int64
          confidence_key: confidence
          confidence_dtype: float32
          require_confidence: true
          anchor_stride: 16
          validate_episode_length: true
          expected_metadata: {complete: "true", dataset_format: robotwin, fps: "15", share_stride: "16", temporal_stride: "6", effective_future_steps: "96", future_horizon_frames: "96", num_frames: "17", target_tokens: "1125", feature_dim: "1024", source_feature_dim: "3072", feature_transform: "tokenwise_pca_v1", cdb_anchor_contract: "shared_future_start"}
        plan:
          enabled: ${framework.latent_reasoning.channels.plan.alignment_enabled}
          relative_dir: moto_plan_robotwin_delta16x6_h96_stride16_samples4_confv1
          target_tokens: ${framework.latent_reasoning.channels.plan.target_tokens}
          target_dim: ${framework.latent_reasoning.channels.plan.target_dim}
          feature_dtype: bfloat16
          anchor_dtype: int64
          confidence_key: confidence
          confidence_dtype: float32
          require_confidence: true
          anchor_stride: 16
          validate_episode_length: true
          expected_metadata: {complete: "true", dataset_format: robotwin, fps: "15", share_stride: "16", segment_delta: "16", segment_count: "6", segment_offsets: "0:16,16:32,32:48,48:64,64:80,80:96", future_horizon_frames: "96", target_tokens: "48", feature_dim: "32", queries_per_segment: "8", cdb_anchor_contract: "shared_future_start"}

trainer:
  max_train_steps: 150000
  num_warmup_steps: 5000
  save_interval: 10000
  eval_interval: 1000
  learning_rate: {base: 1.0e-5, qwen_vl_interface: 1.0e-5, action_model: 1.0e-4}
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs: {min_lr: 5.0e-7}
  freeze_modules: ''
  loss_scale: {vla: 1.0, vlm: 0.1}
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 100
  gradient_accumulation_steps: 1
  optimizer: {name: AdamW, betas: [0.9, 0.95], eps: 1.0e-8, weight_decay: 1.0e-8}
